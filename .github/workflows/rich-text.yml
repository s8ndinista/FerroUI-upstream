name: Rich text conformance

on:
  pull_request:
    paths:
      - '.github/workflows/rich-text.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/FerroUI.Base/**'
      - 'src/FerroUI.Controls/**'
      - 'src/FerroUI.Themes.*/**'
      - 'src/Markup/**'
      - 'src/Windows/FerroUI.WinUI/**'
      - 'src/Windows/FerroUI.Win32/**'
      - 'tests/FerroUI.Markup.Xaml.UnitTests/**'
      - 'docs/porting/winui-rich-text/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rich-text-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  portable:
    name: Document, controls, themes and XAML
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rich-text-portable
      - name: Base contracts
        run: cargo test --locked -p ferroui-base --lib --no-fail-fast
      - name: Full controls suite
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-controls --lib --no-fail-fast
      - name: CoreText synchronization and Win32 bridge host tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-winui -p ferroui-win32 --lib --no-fail-fast
      - name: Actual theme templates and generated markup references
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-themes-winui -p ferroui-themes-fluent -p ferroui-themes-simple --lib --no-fail-fast
      - name: Runtime and compiled XAML
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-markup-xaml-tests --no-fail-fast

  windows:
    name: Native Windows input and automation contracts
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rich-text-windows
      - name: Compile native CoreText adapter
        run: cargo check --locked -p ferroui-winui
      - name: Native WinUI contract tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-winui --lib --no-fail-fast
      - name: Exact native UTF-16 string contracts
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-win32 --lib exact_hstring --no-fail-fast
      - name: Rich text control contracts on Windows
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-controls --lib rich_ --no-fail-fast
