name: Rich text conformance

on:
  pull_request:
    paths:
      - '.github/workflows/rich-text.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/FerroUI.Base/**'
      - 'src/FerroUI.Controls/**'
      - 'src/FerroUI.Themes.*/**'
      - 'src/Markup/**'
      - 'src/Windows/FerroUI.WinUI/**'
      - 'src/Windows/FerroUI.Win32/**'
      - 'tests/FerroUI.Markup.Xaml.UnitTests/**'
      - 'docs/porting/winui-rich-text/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rich-text-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  portable:
    name: Document, controls, themes and XAML
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rich-text-portable
      - name: Install font discovery build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev pkg-config
      - name: Native observation extractor contracts
        run: python3 scripts/porting/test_rich_text_tom_observations.py -v
      - name: Base contracts
        run: cargo test --locked -p ferroui-base --lib --no-fail-fast
      - name: Full controls suite
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-controls --lib --no-fail-fast
      - name: CoreText synchronization and Win32 bridge host tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-winui -p ferroui-win32 --lib --no-fail-fast
      - name: Actual theme templates and generated markup references
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-themes-winui -p ferroui-themes-fluent -p ferroui-themes-simple --lib --no-fail-fast
      - name: Runtime and compiled XAML
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-markup-xaml-tests --no-fail-fast
      - name: Regenerate WinUI theme reference
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-themes-winui --lib tests::compiled_xaml_tests::regenerate_compiled_xaml -- --ignored --exact
      - name: Regenerate Fluent theme reference
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-themes-fluent --lib tests::compiled_xaml_tests::regenerate_compiled_xaml -- --ignored --exact
      - name: Regenerate Simple theme reference
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-themes-simple --lib tests::compiled_xaml_tests::regenerate_compiled_xaml -- --ignored --exact
      - name: Regenerate differential XAML reference
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-markup-xaml-tests --lib emitter::differential_tests::regenerate_emitter_output -- --ignored --exact
      - name: Regenerate markup Rust path reference
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-markup-xaml-tests --lib emitter::rust_paths_tests::regenerate_rust_paths_check -- --ignored --exact
      - name: Verify checked-in generated references
        if: ${{ !cancelled() }}
        run: >-
          git diff --exit-code --
          src/FerroUI.Themes.WinUI/compiled_xaml.rs
          src/FerroUI.Themes.WinUI/compiled_xaml/
          src/FerroUI.Themes.WinUI/compiled_xaml.xamlmeta
          src/FerroUI.Themes.Fluent/compiled_xaml.rs
          src/FerroUI.Themes.Fluent/compiled_xaml.xamlmeta
          src/FerroUI.Themes.Simple/compiled_xaml.rs
          src/FerroUI.Themes.Simple/compiled_xaml.xamlmeta
          tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.rs
          tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.map.json
          tests/FerroUI.Markup.Xaml.UnitTests/emitter/rust_paths_check.rs
      - name: Upload generated references for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rich-text-generated-references
          retention-days: 7
          path: |
            src/FerroUI.Themes.WinUI/compiled_xaml.rs
            src/FerroUI.Themes.WinUI/compiled_xaml/
            src/FerroUI.Themes.WinUI/compiled_xaml.xamlmeta
            src/FerroUI.Themes.Fluent/compiled_xaml.rs
            src/FerroUI.Themes.Fluent/compiled_xaml.xamlmeta
            src/FerroUI.Themes.Simple/compiled_xaml.rs
            src/FerroUI.Themes.Simple/compiled_xaml.xamlmeta
            tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.rs
            tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.map.json
            tests/FerroUI.Markup.Xaml.UnitTests/emitter/rust_paths_check.rs

  windows:
    name: Native Windows input and automation contracts
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rich-text-windows
      - name: Compile native CoreText adapter
        run: cargo check --locked -p ferroui-winui
      - name: Native WinUI contract tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-winui --lib --no-fail-fast
      - name: Exact native UTF-16 string contracts
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-win32 --no-default-features --lib exact_hstring --no-fail-fast
      - name: Characterize system MSFTEDIT selection navigation contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git rev-parse HEAD > system-msftedit-source-commit.txt
          git rev-parse HEAD:src/Windows/FerroUI.Win32/rich_text_tom_oracle_tests.rs > system-msftedit-probe-blob.txt
          set -o pipefail
          cargo test --locked -p ferroui-win32 --no-default-features --lib rich_text_tom_oracle -- --nocapture --test-threads=1 2>&1 | tee system-msftedit.log
      - name: Preserve native observations before the full control suite
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rich-text-system-msftedit
          retention-days: 14
          path: |
            system-msftedit.log
            system-msftedit-source-commit.txt
            system-msftedit-probe-blob.txt
      - name: Rich text control contracts on Windows
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-controls --lib rich_ --no-fail-fast
