name: Repeater and XAML validation

on:
  pull_request:
    paths:
      - '.github/workflows/repeater.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/FerroUI.Base/**'
      - 'src/FerroUI.Controls/**'
      - 'src/Markup/**'
      - 'src/FerroUI.Build.Tasks/**'
      - 'src/FerroUI.Build.Scan/**'
      - 'external/XamlX/**'
      - 'tests/FerroUI.Markup.Xaml.UnitTests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repeater-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    name: Controls and XAML (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Snapshot drift deliberately fails the gate after producing the
          # review artifact. Keep the expensive build for the correcting run.
          cache-on-failure: true
      - name: Build the XAML test executable
        id: xaml-build
        run: |
          cargo test --locked -p ferroui-markup-xaml-tests --lib --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/repeater-xaml-build.jsonl"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifacts = []
          for line in (Path(os.environ['RUNNER_TEMP']) / 'repeater-xaml-build.jsonl').read_text().splitlines():
              message = json.loads(line)
              if (message.get('reason') == 'compiler-artifact'
                      and message.get('target', {}).get('name') == 'ferroui_markup_xaml_tests'
                      and message.get('profile', {}).get('test')
                      and message.get('executable')):
                  artifacts.append(message['executable'])
          if len(artifacts) != 1:
              raise SystemExit(f'Expected one XAML test executable, found {artifacts!r}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'test_binary={artifacts[0]}\n')
          PY
      - name: Regenerate compiler output and Rust-path checks
        env:
          XAML_TEST_BINARY: ${{ steps.xaml-build.outputs.test_binary }}
        run: |
          # Use the same executable for both generators. The first changes a
          # source file, so a second cargo invocation would rebuild too early.
          generation_status=0
          "$XAML_TEST_BINARY" emitter::differential_tests::regenerate_emitter_output --exact --ignored --nocapture || generation_status=$?
          "$XAML_TEST_BINARY" emitter::rust_paths_tests::regenerate_rust_paths_check --exact --ignored --nocapture || generation_status=$?
          exit "$generation_status"
      - name: Upload generated snapshots for review
        if: ${{ always() && steps.xaml-build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repeater-xaml-snapshots-${{ github.sha }}
          path: |
            tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.rs
            tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.map.json
            tests/FerroUI.Markup.Xaml.UnitTests/emitter/rust_paths_check.rs
          if-no-files-found: error
          retention-days: 7
      - name: Test rebuilt XAML output and runtime loading
        if: ${{ !cancelled() && steps.xaml-build.outcome == 'success' }}
        run: cargo test --locked -p ferroui-markup-xaml-tests --lib --no-fail-fast
      - name: Test native Controls and Repeater contracts
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-controls --lib --features ferroui-base/testing,ferroui-base/compiler-metadata,ferroui-base/markup-functions --no-fail-fast
      - name: Verify checked-in snapshots are current
        if: ${{ !cancelled() && steps.xaml-build.outcome == 'success' }}
        run: git diff --exit-code -- tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.rs tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.map.json tests/FerroUI.Markup.Xaml.UnitTests/emitter/rust_paths_check.rs
