name: Transfer verified rich-text WinUI reference

on:
  push:
    branches:
      - feat/winui-rich-text-rust-port
    paths:
      - .github/workflows/rich-text-reference-transfer.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: rich-text-reference-transfer
  cancel-in-progress: false

jobs:
  transfer:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'wieslawsoltes/FerroUI' &&
      github.ref == 'refs/heads/feat/winui-rich-text-rust-port'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/winui-rich-text-rust-port
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify the repository, branch, and unchanged remote head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          assert os.environ["GITHUB_REPOSITORY"] == "wieslawsoltes/FerroUI"
          assert os.environ["GITHUB_EVENT_NAME"] == "push"
          assert os.environ["GITHUB_REF"] == "refs/heads/feat/winui-rich-text-rust-port"
          assert os.environ["TARGET_BRANCH"] == "feat/winui-rich-text-rust-port"
          expected_head = os.environ["GITHUB_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", expected_head)
          assert git("rev-parse", "HEAD") == expected_head
          assert git("remote", "get-url", "origin") in {
              "https://github.com/wieslawsoltes/FerroUI",
              "https://github.com/wieslawsoltes/FerroUI.git",
          }
          assert not git("status", "--porcelain"), "Checkout must be clean"
          remote = git("ls-remote", "--exit-code", "origin", os.environ["GITHUB_REF"]).split()
          assert remote == [expected_head, os.environ["GITHUB_REF"]], "Remote head advanced; refusing transfer"
          PY

      - name: Download and verify the exact generated-reference artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET repos/wieslawsoltes/FerroUI/actions/artifacts/12343074706 > "$RUNNER_TEMP/rich-text-reference-artifact.json"
          gh api --method GET repos/wieslawsoltes/FerroUI/actions/runs/39593957823 > "$RUNNER_TEMP/rich-text-reference-run.json"
          gh api --method GET repos/wieslawsoltes/FerroUI/actions/artifacts/12343074706/zip > "$RUNNER_TEMP/rich-text-reference.zip"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import subprocess
          from zipfile import ZipFile

          expected_repo = "wieslawsoltes/FerroUI"
          expected_branch = "feat/winui-rich-text-rust-port"
          source_head = "3a3c638b36948bb4a3e39aac6b3e6da4dd6ba2fa"
          archive_sha256 = "97e609469c28eea8e5bc3a50b5013a92ba58b890aaa7a9aeaaf81cf2f651f510"
          file_sha256 = "9fc10b7287d41a2485ce49afb24778c0c4e343a8f0362a29907276372cd791b4"
          expected_blob = "1a292a76fdfd29016c5e6a08224a20552c088cc1"
          destination = "src/FerroUI.Themes.WinUI/compiled_xaml.rs"
          allowed_files = {
              "src/FerroUI.Themes.WinUI/compiled_xaml.rs": 17277327,
              "src/FerroUI.Themes.WinUI/compiled_xaml.xamlmeta": 1064,
              "src/FerroUI.Themes.Fluent/compiled_xaml.rs": 7378084,
              "src/FerroUI.Themes.Fluent/compiled_xaml.xamlmeta": 1410,
              "src/FerroUI.Themes.Simple/compiled_xaml.rs": 3729566,
              "src/FerroUI.Themes.Simple/compiled_xaml.xamlmeta": 756,
              "tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.rs": 452476,
              "tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.map.json": 84321,
          }
          temp = Path(os.environ["RUNNER_TEMP"])
          artifact = json.loads((temp / "rich-text-reference-artifact.json").read_text())
          run = json.loads((temp / "rich-text-reference-run.json").read_text())
          assert artifact["id"] == 12343074706
          assert artifact["name"] == "rich-text-generated-references"
          assert artifact["expired"] is False
          assert artifact["digest"] == "sha256:" + archive_sha256
          assert artifact["workflow_run"]["id"] == 39593957823
          assert artifact["workflow_run"]["head_sha"] == source_head
          assert artifact["workflow_run"]["head_branch"] == expected_branch
          assert run["id"] == 39593957823
          assert run["head_sha"] == source_head
          assert run["head_branch"] == expected_branch
          assert run["repository"]["full_name"] == expected_repo
          assert run["head_repository"]["full_name"] == expected_repo
          archive = temp / "rich-text-reference.zip"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == archive_sha256
          with ZipFile(archive) as zipped:
              entries = zipped.infolist()
              names = [entry.filename for entry in entries]
              assert len(names) == len(set(names)), "Duplicate archive paths"
              assert set(names) == set(allowed_files), "Unexpected or missing archive path"
              for entry in entries:
                  path = PurePosixPath(entry.filename)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert not entry.is_dir()
                  assert stat.S_IFMT(entry.external_attr >> 16) in (0, stat.S_IFREG)
                  assert entry.file_size == allowed_files[entry.filename]
              content = zipped.read(destination)
          assert hashlib.sha256(content).hexdigest() == file_sha256
          blob = hashlib.sha1(b"blob " + str(len(content)).encode("ascii") + b"\0" + content).hexdigest()
          assert blob == expected_blob
          content.decode("utf-8")
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          target = root / destination
          assert target.parent.resolve().is_relative_to(root)
          assert target.is_file() and not target.is_symlink()
          target.write_bytes(content)
          assert subprocess.check_output(["git", "hash-object", destination], cwd=root, text=True).strip() == expected_blob
          print("Installed only the verified WinUI reference:", file_sha256, expected_blob)
          PY

      - name: Commit the verified reference and push normally
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- src/FerroUI.Themes.WinUI/compiled_xaml.rs
          git add -- src/FerroUI.Themes.WinUI/compiled_xaml.rs
          python3 - <<'PY'
          import os
          import subprocess

          expected_paths = {
              b"src/FerroUI.Themes.WinUI/compiled_xaml.rs",
          }
          staged = subprocess.check_output(["git", "diff", "--cached", "--name-only", "-z"])
          assert set(staged.rstrip(b"\0").split(b"\0")) == expected_paths
          subprocess.run(["git", "diff", "--quiet"], check=True)
          assert not subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"])
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"]
          remote = subprocess.check_output(["git", "ls-remote", "--exit-code", "origin", os.environ["GITHUB_REF"]], text=True).split()
          assert remote == [head, os.environ["GITHUB_REF"]], "Remote head advanced; refusing commit"
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(themes): transfer verified WinUI compiled reference'
          python3 - <<'PY'
          import os
          import subprocess

          remote = subprocess.check_output(["git", "ls-remote", "--exit-code", "origin", os.environ["GITHUB_REF"]], text=True).split()
          assert remote == [os.environ["GITHUB_SHA"], os.environ["GITHUB_REF"]], "Remote head advanced; refusing push"
          PY
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
