[package]
name = "safe-area-demo"
description = "The SafeAreaDemo sample of FerroUI: the safe area, the system bars and the input pane of a top-level, shared by the desktop, Android and iOS hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

# Unit tests live next to the code (`tests/` modules of the library), not as integration test
# targets.
autotests = false
autobenches = false
autoexamples = false
autobins = false

# The shared content of the sample (`SafeAreaDemo.csproj`): the hosts `SafeAreaDemo.Desktop`,
# `SafeAreaDemo.Android` and `SafeAreaDemo.iOS` depend on it.
[lib]
path = "lib.rs"

[dependencies]
# The compiled markup of the crate calls the typed functions of the declared members.
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
ferroui-markup = { workspace = true }
ferroui-markup-xaml = { workspace = true }
ferroui-themes-fluent = { workspace = true }
mini-mvvm = { path = "../MiniMvvm" }
sample-support = { path = "../SampleSupport" }

[build-dependencies]
sample-build = { path = "../SampleBuild" }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
sample-testing = { path = "../SampleTesting" }
