[package]
name = "seven-guis-macros"
description = "The 7GUIs tasks written with the rsx! macro and the components of ferroui-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

autotests = false

[lib]
path = "lib.rs"

[[bin]]
name = "seven-guis-macros"
path = "main.rs"

[dependencies]
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-view = { workspace = true, features = ["desktop"] }
seven-guis-model = { path = "../SevenGuis" }

[dev-dependencies]
seven-guis-model = { path = "../SevenGuis", features = ["scenarios"] }
