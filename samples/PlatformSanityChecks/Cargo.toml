[package]
name = "platform-sanity-checks"
description = "The PlatformSanityChecks sample of FerroUI: checks of the threading of the X11 platform (signals from another thread, the order and the rate of timers) without a window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

# Unit tests live next to the code (`tests/` modules of the library), not as integration test
# targets.
autotests = false
autobenches = false
autoexamples = false
autobins = false

[lib]
path = "lib.rs"

# The entry point: `Program.cs` of the upstream sample.
[[bin]]
name = "platform-sanity-checks"
path = "program.rs"

[dependencies]
# The compiled markup of the crate calls the typed functions of the declared members.
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
ferroui-markup = { workspace = true }
ferroui-markup-xaml = { workspace = true }
ferroui-themes-simple = { workspace = true }
sample-support = { path = "../SampleSupport" }

# The checks run on the X11 platform, as in the reference: Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
ferroui-x11 = { workspace = true }

[build-dependencies]
sample-build = { path = "../SampleBuild" }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
sample-testing = { path = "../SampleTesting" }
